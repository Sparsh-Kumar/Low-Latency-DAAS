[project]
name = "live-trades"
version = "0.1.0"
description = "Streams live cryptocurrency trades from exchanges"
requires-python = ">=3.12,<3.14"
dependencies = [
  "ccxt==4.5.28",
  "colorama==0.4.6",
  "pymongo==4.16.0",
  "python-dotenv==1.2.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=job",
  "--cov-report=term-missing",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "ASYNC",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "."
strict = true
warn_unused_configs = true

